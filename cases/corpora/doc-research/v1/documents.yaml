# Document corpus for the doc-research workload, v1.
#
# Held as one file rather than a tree of markdown files: the mock corpus_search
# and document_fetch tools serve from it, and a single file is reviewable in
# one sitting, which matters for something that gets frozen.
#
# No document carries the answer. Each carries a primitive control value, and
# the answer code is rendered from the winning document's value by the rule in
# SELECTION.md. Grepping every control_value in the corpus tells an agent
# nothing about which one applies — that is the whole task.
#
# `doc_id` values are the citable index for this workload. A citation that does
# not resolve to one of these fails the gate.

documents:
  # ---- data-retention -----------------------------------------------------
  - doc_id: doc-001
    topic: data-retention
    region: global
    status: active
    effective_from: '2025-01-01'
    supersedes: null
    control_unit: days
    control_value: 365
    title: Global Records Retention Standard
    body: >
      Records generated by any business system are retained for the period
      stated in this standard unless a regional standard applies. Retention is
      measured from the date the record is closed, not the date it was created.

  - doc_id: doc-002
    topic: data-retention
    region: emea
    status: active
    effective_from: '2025-06-01'
    supersedes: null
    control_unit: days
    control_value: 180
    title: EMEA Records Retention Standard
    body: >
      Within EMEA, records are retained for the period stated here, which
      overrides the global standard. Regional supervisory guidance was the
      basis for shortening the period.

  - doc_id: doc-003
    topic: data-retention
    region: emea
    status: active
    effective_from: '2026-02-01'
    supersedes: doc-002
    control_unit: days
    control_value: 90
    title: EMEA Records Retention Standard (revised)
    body: >
      This revision replaces the previous EMEA standard and shortens the
      retention period further. Systems in scope must be reconfigured within
      one quarter of the effective date.

  - doc_id: doc-004
    topic: data-retention
    region: apac
    status: draft
    effective_from: '2026-03-01'
    supersedes: null
    control_unit: days
    control_value: 120
    title: APAC Records Retention Standard (draft)
    body: >
      Circulated for comment. Not approved, and not to be relied on for any
      operational decision until ratified.

  - doc_id: doc-005
    topic: data-retention
    region: amer
    status: active
    effective_from: '2026-05-01'
    supersedes: null
    control_unit: days
    control_value: 200
    title: AMER Records Retention Standard
    body: >
      Approved and dated ahead of its effective date. Until that date the
      global standard continues to apply in AMER.

