  # ---- scope note, cited alongside a regional answer ----------------------
  - doc_id: doc-020
    topic: scope
    region: global
    status: active
    effective_from: '2025-01-01'
    supersedes: null
    control_unit: none
    control_value: 0
    title: Standards Precedence and Scope Note
    body: >
      Where a regional standard exists and is in force, it takes precedence
      over the global standard for that topic. A standard has no force before
      its effective date, and a draft has no force at any time. A standard
      that has been superseded ceases to apply from the effective date of the
      standard that replaced it.
