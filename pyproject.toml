[project]
name = "outcomefuse"
version = "0.1.0"
description = "The quality-gated budget runtime for AI agents"
readme = "doc/info.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outcomefuse"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Without this the suite only runs after an install, an undeclared precondition.
pythonpath = ["src"]
addopts = "--strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "S", "PTH", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, spawn the module CLI on purpose, and build paths under pytest's tmp_path.
"tests/**" = ["S101", "S103", "S108", "S404", "S603", "S607"]
