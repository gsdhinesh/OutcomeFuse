# Outcome Contract — Refund desk adjudication
#
# A client's contract, not one of the four frozen workloads. It names a
# workload (`refund-desk`) that `outcomefuse.workloads.tool_port_for` has never
# heard of, on purpose: the whole point of this client is that the library can
# be plugged into a use case it was not built around, without editing anything
# under `src/`.
#
# The domain: a support desk adjudicates a customer's refund request against
# the order, the shipment and the published refund policy, then either moves
# money or does not. The money move is the reason governance is worth anything
# here — it is irreversible, it is the one step nobody wants an agent taking on
# its own, and it is declared side-effecting so no optimisation may touch it.

contract_id: rdc-refund-desk
version: 1
workload: refund-desk

task_goal: >
  Adjudicate one customer refund request against the order record, the shipment
  record and the published refund policy, and either issue the refund or refuse
  it, citing the clauses relied on.

deliverable:
  structure:
    order_id: string
    decision: string        # approve-full | approve-partial | deny
    refund_amount: number   # 0 where the decision is deny
    reason_code: string     # controlled code from the case answer key
    policy_refs: array      # clauses resolvable in the citable index

criteria:
  mandatory:
    - id: decision-matches-key
      description: >
        The disposition equals the answer key. This is the only thing the
        customer and the finance team both care about, so it is checked against
        a known-correct value rather than against a list of legal strings.
      classification: E
      verifier:
        type: exact-match-against-answer-key
        args: { path: $.decision, key: decision }

    - id: reason-code-matches-key
      description: >
        The reason code equals the answer key. Checkable only because the
        vocabulary is closed and the key was authored with the case — a
        controlled-vocabulary match, not an understanding of the refund.
      classification: E
      verifier:
        type: exact-match-against-answer-key
        args: { path: $.reason_code, key: reason_code }

    - id: refund-within-order-total
      description: >
        The desk may not refund more than the customer paid. The upper bound
        comes from the answer key rather than a constant, because the ceiling is
        a property of the order and not of the workload.
      classification: E
      verifier:
        type: numeric-range
        args: { path: $.refund_amount, of: value, min: 0, max_from_key: order_total }

    - id: policy-refs-resolve
      description: >
        Every clause cited actually exists. An invented clause is the failure
        mode that would most damage a refund decision on appeal.
      classification: E
      verifier:
        type: citation-resolves
        args: { path: '$.policy_refs[*].id', min_citations: 1 }

    - id: order-id-present
      description: The decision names the order it is about.
      classification: E
      verifier: { type: field-present, args: { path: $.order_id } }

  optional:
    - id: decision-is-a-known-disposition
      description: >
        The label is one the downstream finance system can act on. Optional
        rather than mandatory: `decision-matches-key` already subsumes it, and a
        mandatory criterion that can never fail when its neighbour passes adds
        nothing to the floor.
      classification: E
      verifier:
        type: set-membership
        args: { path: $.decision, allowed: [approve-full, approve-partial, deny] }

  advisory:
    - id: refund-is-defensible-on-appeal
      description: >
        Whether the cited clauses actually support the disposition. This is what
        a refunds manager would review, and no deterministic verifier reaches
        it. Naming it advisory is the honest position.
      classification: A

budget:
  max_tokens: 60000
  max_estimated_cost: 0.50
  verification_reserve:
    max_tokens: 9000
    max_estimated_cost: 0.075
  max_tool_calls: 20
  max_iterations: 6

tools:
  - name: order_lookup
    deterministic: true
    side_effecting: false
  - name: shipment_status
    deterministic: true
    side_effecting: false
  - name: refund_policy_lookup
    deterministic: true
    side_effecting: false
  - name: issue_refund
    # Moves money. Declared side-effecting so FR33 excludes it from every
    # optimisation-driven suppression: caching a payment would be a defect, and
    # the governor's own rule is what prevents it.
    deterministic: false
    side_effecting: true

models:
  eligible: [gpt-5-mini, gpt-5]
  start: gpt-5-mini

escalation:
  # Deliberately not `retry-then-escalate`. This client exists to show what the
  # governor does to a loop, and a model-routing retry would mix a second effect
  # into every number on the comparison.
  on_gate_fail: return-partial
  max_escalations: 0
  never_breach_verification_reserve: true

human_approval_conditions:
  - tool: issue_refund
    when: always
approval_timeout_seconds: 120
on_timeout: request-human
