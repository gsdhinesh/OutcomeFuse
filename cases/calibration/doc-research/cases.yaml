# Calibration cases — doc-research workload.
#
# `reference` is a query: topic, region and as-of date. The deriver applies the
# rule in the corpus's SELECTION.md to compute primary_source_id and
# answer_code. No document carries an answer, so neither keyed field is
# authored.
#
# Distractors here name the rule STEP a wrong reading skips. The checker
# re-runs selection with that step disabled and asserts the result differs —
# which proves both that the trap discriminates and that it corresponds to a
# real reasoning error rather than an arbitrary wrong string.

corpus_ref: cases/corpora/doc-research/v1
workload: doc-research
split: calibration
data_class: synthetic

cases:
  - case_id: dr-c-001
    difficulty: direct
    guess_baseline: 0.06
    expected_outcome: answer
    prompt: >
      What records retention period applies in APAC as at 10 January 2026?
      Give the answer, name the document it rests on, and cite the sources you
      relied on.
    reference: { topic: data-retention, region: apac, as_of: '2026-01-10' }
    notes: >
      APAC has a retention standard, but it is a draft and carries no force, so
      the global standard governs. The simplest case in the set and still not a
      single lookup.

  - case_id: dr-c-002
    difficulty: direct
    guess_baseline: 0.06
    expected_outcome: answer
    prompt: >
      What access review cycle applies in APAC as at 15 March 2026? Give the
      answer, name the document it rests on, and cite the sources you relied on.
    reference: { topic: access-review, region: apac, as_of: '2026-03-15' }
    notes: APAC has no access-review standard at all, so the global one governs.

  - case_id: dr-c-003
    difficulty: direct
    guess_baseline: 0.06
    expected_outcome: answer
    prompt: >
      What incident notification window applies in AMER as at 15 March 2026?
      Give the answer, name the document it rests on, and cite the sources you
      relied on.
    reference: { topic: incident-notification, region: amer, as_of: '2026-03-15' }
    notes: >
      Two EMEA standards exist for this topic and neither applies in AMER.
      Region scoping alone decides it.

  - case_id: dr-c-004
    difficulty: direct
    guess_baseline: 0.06
    expected_outcome: answer
    prompt: >
      What vendor approval threshold applies in APAC as at 1 July 2026? Give
      the answer, name the document it rests on, and cite the sources you
      relied on.
    reference: { topic: vendor-approval, region: apac, as_of: '2026-07-01' }
    notes: Regional thresholds exist for AMER and EMEA; neither reaches APAC.

  - case_id: dr-c-005
    difficulty: multi-hop
    guess_baseline: 0.06
    expected_outcome: answer
    prompt: >
      What records retention period applied in EMEA as at 1 September 2025?
      Give the answer, name the document it rests on, and cite the sources you
      relied on.
    reference: { topic: data-retention, region: emea, as_of: '2025-09-01' }
    notes: >
      A revised EMEA standard exists but does not take effect until 2026, so
      the earlier EMEA standard governs. Answering as of a past date is the
      hop most often skipped.

  - case_id: dr-c-006
    difficulty: multi-hop
    guess_baseline: 0.06
    expected_outcome: answer
    prompt: >
      What records retention period applies in EMEA as at 15 March 2026? Give
      the answer, name the document it rests on, and cite the sources you
      relied on.
    reference: { topic: data-retention, region: emea, as_of: '2026-03-15' }
    notes: >
      The mirror of dr-c-005 past the revision date. Same topic and region,
      different governing document.

  - case_id: dr-c-007
    difficulty: multi-hop
    guess_baseline: 0.06
    expected_outcome: answer
    prompt: >
      What incident notification window applied in EMEA as at 10 January 2026?
      Give the answer, name the document it rests on, and cite the sources you
      relied on.
    reference: { topic: incident-notification, region: emea, as_of: '2026-01-10' }
    notes: Before the EMEA revision takes effect. The superseded standard still governs.

  - case_id: dr-c-008
    difficulty: multi-hop
    guess_baseline: 0.06
    expected_outcome: answer
    prompt: >
      What incident notification window applies in EMEA as at 1 July 2026?
      Give the answer, name the document it rests on, and cite the sources you
      relied on.
    reference: { topic: incident-notification, region: emea, as_of: '2026-07-01' }
    notes: After the revision. Pairs with dr-c-007 to test the date, not the pattern.

  - case_id: dr-c-009
    difficulty: multi-hop
    guess_baseline: 0.06
    expected_outcome: answer
    prompt: >
      What backup frequency applies in APAC as at 1 July 2026? Give the
      answer, name the document it rests on, and cite the sources you relied on.
    reference: { topic: backup-frequency, region: apac, as_of: '2026-07-01' }
    notes: >
      APAC has no standard for most topics but does for this one, so an agent
      that has learned "APAC falls back to global" from earlier cases is wrong
      here.

  - case_id: dr-c-010
    difficulty: distractor-heavy
    guess_baseline: 0.06
    expected_outcome: answer
    prompt: >
      What records retention period applies in AMER as at 15 March 2026? Give
      the answer, name the document it rests on, and cite the sources you
      relied on.
    reference: { topic: data-retention, region: amer, as_of: '2026-03-15' }
    distractors:
      - id: ignore-effective-date
        detail: >
          An AMER retention standard exists, is approved, and is not superseded
          — everything about it looks authoritative except its effective date,
          which is still weeks away. Region precedence makes it the obvious
          answer to anyone who does not check the date.
        skip_step: effective-dating
      - id: ignore-region-precedence
        detail: >
          Reading region precedence out entirely also changes the answer, since
          the AMER standard would then compete on date alone.
        skip_step: region-precedence
    notes: >
      The purest test of effective-dating in the set: the trap document is
      correct on every other axis.

  - case_id: dr-c-011
    difficulty: distractor-heavy
    guess_baseline: 0.06
    expected_outcome: answer
    prompt: >
      What backup frequency applies in EMEA as at 15 March 2026? Give the
      answer, name the document it rests on, and cite the sources you relied on.
    reference: { topic: backup-frequency, region: emea, as_of: '2026-03-15' }
    distractors:
      - id: ignore-effective-date
        detail: >
          A revised EMEA standard supersedes the one that governs here, but not
          until May. Treating supersession as immediate retires the correct
          document two months early and leaves the newer, not-yet-effective one.
        skip_step: effective-dating
    notes: >
      A revised EMEA standard exists but does not take effect until May, so
      the current one still governs. Treating a supersession as immediate
      rather than dated is the failure the rule's step ordering exists to
      prevent.

  - case_id: dr-c-012
    difficulty: unanswerable
    guess_baseline: 0.0
    expected_outcome: partial
    prompt: >
      What records retention period applied in EMEA as at 1 December 2024?
      Give the answer, name the document it rests on, and cite the sources you
      relied on.
    unmet_criteria:
      - answer-matches-key
      - primary-source-matches-key
    notes: >
      Every retention standard in the corpus, global and regional alike, takes
      effect after this date. No document governs, and falling back to the
      global standard is not available — it is excluded on the same grounds as
      everything else. The trap is that the corpus plainly contains retention
      standards, so there is always something confident to say.
