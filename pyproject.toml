[project]
name = "outcomefuse"
version = "0.1.0"
description = "The quality-gated budget runtime for AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
]

# The live model adapter needs `openai` and `azure-identity`. They are
# deliberately NOT declared here: `uv.lock` is committed, and a dependency this
# machine's TLS interception cannot resolve would break `uv run pytest` for
# everyone. They are imported lazily, so the suite runs without them. Install
# them when you want to talk to a real deployment:
#
#     uv pip install openai azure-identity

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outcomefuse"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Without this the suite only runs after an install, an undeclared precondition.
# freeze/ is on the path because the scripts that decide whether every answer
# key is correct are themselves under test.
pythonpath = ["src", "freeze"]
addopts = "--strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "freeze"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "S", "PTH", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, spawn the module CLI on purpose, and build paths under pytest's tmp_path.
"tests/**" = ["S101", "S103", "S108", "S404", "S603", "S607"]
